name: presslabz

# Named volumes rather than bind mounts: the containers run as their own users
# and bind-mounted data ends up root-owned on the host, which makes a reset
# impossible without elevation. `pnpm services:reset` wipes these cleanly.
volumes:
  postgres-data:
  valkey-data:
  minio-data:

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-presslabz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-presslabz}
      POSTGRES_DB: ${POSTGRES_DB:-presslabz}
      # ICU collation, so ordering does not shift with the host locale.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=und --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ images expect the mount at /var/lib/postgresql and place
      # the cluster in a version-named subdirectory, so that pg_upgrade --link
      # does not have to cross a mount boundary.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-presslabz} -d ${POSTGRES_DB:-presslabz}']
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.1-alpine
    restart: unless-stopped
    command: ['valkey-server', '--save', '60', '1', '--appendonly', 'no']
    ports:
      - '${VALKEY_PORT:-6379}:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-presslabz}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-presslabz-dev-secret}
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
