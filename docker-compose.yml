name: presslabz

# Named volumes rather than bind mounts: the containers run as their own users
# and bind-mounted data ends up root-owned on the host, which makes a reset
# impossible without elevation. `pnpm services:reset` wipes these cleanly.
volumes:
  postgres-data:
  valkey-data:
  storage-data:

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-presslabz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-presslabz}
      POSTGRES_DB: ${POSTGRES_DB:-presslabz}
      # ICU collation, so ordering does not shift with the host locale.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=und --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ images expect the mount at /var/lib/postgresql and place
      # the cluster in a version-named subdirectory, so that pg_upgrade --link
      # does not have to cross a mount boundary.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-presslabz} -d ${POSTGRES_DB:-presslabz}']
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.1-alpine
    restart: unless-stopped
    command: ['valkey-server', '--save', '60', '1', '--appendonly', 'no']
    ports:
      - '${VALKEY_PORT:-6379}:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # SeaweedFS rather than MinIO: MinIO's repository is archived and two
  # unauthenticated-object-write advisories against it have no patched release
  # and will never get one. See infra/storage/README.md for what was measured
  # before this replaced it.
  #
  # Published on 9000 — the port MinIO used — so that an existing .env keeps
  # working; SeaweedFS speaks S3 on 8333 inside the container.
  storage:
    image: chrislusf/seaweedfs:4.43@sha256:7bea581f48155c069d3c725e60c386c88210c67cde8bce412344ff6ebea264da
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.config=/etc/seaweedfs/s3-identities.json
    ports:
      - '${S3_PORT:-9000}:8333'
    volumes:
      - storage-data:/data
      # The identities: the development key is a real credential here, and
      # anonymous may read and nothing else.
      - ./infra/storage/s3-identities.json:/etc/seaweedfs/s3-identities.json:ro
    healthcheck:
      # Its own address, not localhost: SeaweedFS binds the S3 port to the
      # container's interface, so a loopback probe is refused by a server that
      # is working perfectly. `--spider` reports success on the 403 an unsigned
      # request earns, which is exactly what a running, guarded endpoint says.
      test: ['CMD-SHELL', 'wget -q --spider "http://$$(hostname -i):8333/" 2>&1 | grep -q "403\|200"']
      interval: 5s
      timeout: 5s
      retries: 20
