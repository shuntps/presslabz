packages:
  - apps/*
  - packages/*
  - themes/*
  - e2e

# drizzle-kit still pulls the deprecated @esbuild-kit/esm-loader, which pins
# esbuild 0.18 — vulnerable to GHSA dev-server request forgery. drizzle-kit
# also depends on esbuild ^0.25.4 and tsx directly, so the old loader is
# legacy baggage. Remove this override once drizzle-kit drops it.
overrides:
  esbuild@<0.25.0: '>=0.25.0'

# Build scripts are denied by default; each one is an arbitrary-code-execution
# point at install time. esbuild is allowed because it downloads its platform
# binary in postinstall and cannot work without it.
allowBuilds:
  esbuild: true

# Single source of truth for dependency versions across every workspace.
# Packages reference these with "catalog:" instead of pinning their own.
catalog:
  # Language and tooling
  typescript: 7.0.2
  turbo: 2.10.10
  '@biomejs/biome': 2.5.8
  vitest: 4.1.10
  '@types/node': 26.2.0

  # API
  fastify: 5.12.0
  fastify-plugin: 6.0.0
  '@fastify/cors': 11.3.0
  '@fastify/cookie': 11.1.2
  '@fastify/helmet': 13.1.0
  '@fastify/rate-limit': 11.2.0
  # The library Fastify itself resolves trustProxy with. Declared directly
  # because the header mode has to answer "is this peer a declared proxy?"
  # about the socket address, which is a different question from the one
  # trustProxy answers — and reimplementing CIDR matching for IPv6 to ask it
  # would be a second, worse copy of this.
  '@fastify/proxy-addr': 5.1.0

  # Auth
  '@node-rs/argon2': 2.1.0

  # Public site. Astro 7 ships route caching with tag invalidation and a
  # Cache Provider API, which is what packages/cache plugs into: the API is a
  # separate process, so an in-process invalidate() could never reach it.
  astro: 7.2.4
  '@astrojs/node': 11.1.4

  # Admin
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  vite: 8.2.1
  '@vitejs/plugin-react': 6.0.5
  '@tanstack/react-query': 5.101.4
  '@axe-core/playwright': 4.13.0
  '@playwright/test': 1.62.1
  '@tanstack/react-router': 1.170.29

  # Admin tests. jsdom rather than a real browser in CI: it catches the state
  # and rendering faults, and a browser download on every build does not pay
  # for the layout checks that stay a development-time tool.
  jsdom: 30.0.1
  '@testing-library/react': 16.3.2
  '@testing-library/dom': 10.4.1
  '@testing-library/user-event': 14.6.4

  # Database
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  postgres: 3.4.9

  # Cache and sessions
  iovalkey: 0.4.0

  # Media. sharp re-encodes every upload, which is also what guarantees
  # nothing executable survives the trip into the bucket.
  sharp: 0.35.3
  '@aws-sdk/client-s3': 3.1111.0
  '@fastify/multipart': 10.1.1

  # Validation
  zod: 4.4.3
