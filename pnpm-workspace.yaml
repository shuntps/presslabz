packages:
  - apps/*
  - packages/*
  - themes/*

# drizzle-kit still pulls the deprecated @esbuild-kit/esm-loader, which pins
# esbuild 0.18 — vulnerable to GHSA dev-server request forgery. drizzle-kit
# also depends on esbuild ^0.25.4 and tsx directly, so the old loader is
# legacy baggage. Remove this override once drizzle-kit drops it.
overrides:
  esbuild@<0.25.0: '>=0.25.0'

# Build scripts are denied by default; each one is an arbitrary-code-execution
# point at install time. esbuild is allowed because it downloads its platform
# binary in postinstall and cannot work without it.
allowBuilds:
  esbuild: true

# Single source of truth for dependency versions across every workspace.
# Packages reference these with "catalog:" instead of pinning their own.
catalog:
  # Language and tooling
  typescript: 7.0.2
  turbo: 2.10.10
  '@biomejs/biome': 2.5.8
  vitest: 4.1.10
  '@types/node': 26.2.0

  # API
  fastify: 5.12.0
  fastify-plugin: 6.0.0
  '@fastify/cors': 11.3.0
  '@fastify/cookie': 11.1.2
  '@fastify/helmet': 13.1.0
  '@fastify/rate-limit': 11.2.0

  # Auth
  '@node-rs/argon2': 2.1.0

  # Admin
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  vite: 8.2.1
  '@vitejs/plugin-react': 6.0.5
  '@tanstack/react-query': 5.101.4
  '@tanstack/react-router': 1.170.29

  # Admin tests. jsdom rather than a real browser in CI: it catches the state
  # and rendering faults, and a browser download on every build does not pay
  # for the layout checks that stay a development-time tool.
  jsdom: 30.0.1
  '@testing-library/react': 16.3.2
  '@testing-library/dom': 10.4.1
  '@testing-library/user-event': 14.6.4

  # Database
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  postgres: 3.4.9

  # Cache and sessions
  iovalkey: 0.4.0

  # Validation
  zod: 4.4.3
