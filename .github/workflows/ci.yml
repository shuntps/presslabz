name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned by digest: a tag can be repushed, a digest cannot.
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: presslabz
          POSTGRES_PASSWORD: presslabz
          POSTGRES_DB: presslabz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U presslabz -d presslabz"
          --health-interval 5s --health-timeout 5s --health-retries 10

      valkey:
        image: valkey/valkey:9.1.1-alpine@sha256:de31910896150d5e754a07d57d227cfdde4e258ddd0d1aa4607f2d2f95843715
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://presslabz:presslabz@localhost:5432/presslabz
      VALKEY_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: presslabz-media
      S3_ACCESS_KEY_ID: presslabz
      S3_SECRET_ACCESS_KEY: presslabz-dev-secret

    steps:
      # Every third-party action is pinned to a full commit, because a tag is
      # a name its owner can move: `@v7` today and `@v7` tomorrow can be
      # different code, and nothing in a diff would show it. The version beside
      # each one is for people; the SHA is what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm comes from npm rather than from pnpm/action-setup: that action
      # bundles a brace-expansion affected by GHSA-3jxr-9vmj-r5cp, and the
      # shortest way to stop shipping a vulnerable dependency is to stop
      # depending on the thing that carries it. The version is read from
      # `packageManager` so the workflow and the repository cannot disagree
      # about which pnpm this is.
      - name: Install pnpm
        run: npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      # After pnpm, because the cache it configures needs pnpm on PATH.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Not a service container: the MinIO image needs `server /data` as its
      # command, and a service block cannot supply one. Same image tag as
      # docker-compose, so there is one version to keep current.
      - name: Start object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=$S3_ACCESS_KEY_ID \
            -e MINIO_ROOT_PASSWORD=$S3_SECRET_ACCESS_KEY \
            minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for _ in $(seq 1 40); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become ready" >&2
          docker logs minio >&2
          exit 1

      - name: Lint and format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The type checker never emits and Vitest transpiles through esbuild, so
      # neither sees the syntax Node refuses to strip. This loads the server's
      # real module graph through Node's own loader — no server started, no
      # data touched — which is the only place that divergence shows up.
      - name: Load the server under Node's TypeScript runtime
        run: pnpm --filter @presslabz/api check:native

      # Before the tests, not after: the repository suite runs against the
      # real database, because the guarantees worth asserting there are
      # properties of a transaction and do not survive a fake.
      - name: Apply migrations
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      # The browser suite builds its own database and starts its own pair of
      # servers, so it needs no fixture from the steps above — only Chromium,
      # which is not in the runner image and is downloaded here rather than
      # carried as a dependency of every developer's install.
      - name: Install Chromium
        run: pnpm --filter @presslabz/e2e exec playwright install --with-deps chromium

      # Where an accessibility regression is caught: axe scans every screen,
      # and a keyboard walks the path from an empty document to a saved one.
      - name: Browser tests
        run: pnpm e2e

      - name: Keep the browser report of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Build
        run: pnpm build
