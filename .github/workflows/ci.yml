name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: presslabz
          POSTGRES_PASSWORD: presslabz
          POSTGRES_DB: presslabz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U presslabz -d presslabz"
          --health-interval 5s --health-timeout 5s --health-retries 10

      valkey:
        image: valkey/valkey:9.1.1-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://presslabz:presslabz@localhost:5432/presslabz
      VALKEY_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: presslabz-media
      S3_ACCESS_KEY_ID: presslabz
      S3_SECRET_ACCESS_KEY: presslabz-dev-secret

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Not a service container: the MinIO image needs `server /data` as its
      # command, and a service block cannot supply one. Same image tag as
      # docker-compose, so there is one version to keep current.
      - name: Start object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=$S3_ACCESS_KEY_ID \
            -e MINIO_ROOT_PASSWORD=$S3_SECRET_ACCESS_KEY \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 1 40); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become ready" >&2
          docker logs minio >&2
          exit 1

      - name: Lint and format
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The type checker never emits and Vitest transpiles through esbuild, so
      # neither sees the syntax Node refuses to strip. This loads the server's
      # real module graph through Node's own loader — no server started, no
      # data touched — which is the only place that divergence shows up.
      - name: Load the server under Node's TypeScript runtime
        run: pnpm --filter @presslabz/api check:native

      # Before the tests, not after: the repository suite runs against the
      # real database, because the guarantees worth asserting there are
      # properties of a transaction and do not survive a fake.
      - name: Apply migrations
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
